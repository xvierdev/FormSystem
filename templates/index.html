{% extends "base.html" %}

{% block title %}Iniciar Questionário{% endblock %}

{% block content %}
    <h1>Bem-vindo ao Questionário!</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('iniciar_questionario') }}" method="POST">
        <label for="nome_aluno">Digite seu nome:</label>
        <input type="text" id="nome_aluno" name="nome_aluno" required>
        <button type="submit">Iniciar Questionário</button>
    </form>
{% endblock %}
