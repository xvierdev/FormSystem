{% extends "base.html" %}

{% block title %}Questionário Concluído!{% endblock %}

{% block content %}
    <h1 class="success">Questionário Concluído, {{ nome_aluno }}!</h1>
    <p>Obrigado por completar o questionário.</p>
    <div class="score-info">
        Você acertou {{ acertos }} de {{ total }} perguntas!
    </div>
    <a href="{{ url_for('index') }}" class="button-link inicio">Voltar ao Início</a>
{% endblock %}
