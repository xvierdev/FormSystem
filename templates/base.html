<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Questionário{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-brand">Início</a>
        <div class="nav-links">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('relatorio') }}">Relatório</a>
            <a href="{{ url_for('estatisticas') }}">Estatísticas</a> <!-- NOVO LINK -->
            <a href="{{ url_for('upload_csv') }}">Upload</a>
            <a href="{{ url_for('configuracoes') }}">Configurações</a>
            <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}">Admin Login</a>
            {% endif %}
        </div>
    </nav>
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    {% block scripts %}{% endblock %}
</body>

</html>
